services:

  postgres:
    image: postgres:16
    container_name: pip-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: pip_user
      POSTGRES_PASSWORD: pip_password
      POSTGRES_DB: pip_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - pip-network

  redis:
    image: redis:7
    container_name: pip-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    networks:
      - pip-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pip-rabbitmq
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - pip-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pip-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - pip-network

  minio:
    image: minio/minio:latest
    container_name: pip-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: pipadmin
      MINIO_ROOT_PASSWORD: pipminio123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - pip-network
  ollama:
    image: ollama/ollama:latest
    container_name: pip-ollama
    restart: unless-stopped
    
    ports:
       - "11434:11434"
    
    volumes:
          - ollama_data:/root/.ollama
    
    networks:
          - pip-network
  pgadmin:
    image: dpage/pgadmin4
    container_name: pip-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pip.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - pip-network

volumes:
  postgres_data:
  rabbitmq_data:
  qdrant_data:
  minio_data:
  ollama_data:
networks:
  pip-network:
    driver: bridge